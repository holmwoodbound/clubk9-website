<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 86 900 554" role="img"
     aria-labelledby="mapTitle mapDesc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif">
  <title id="mapTitle">Map of the Club K9 site</title>
  <desc id="mapDesc">An illustrated plan of Club K9, a working farm near Rusper. From the entrance: the K9-iQ
    indoor play and enrichment barn, then the car park, then the reception and stable-block rest area which
    opens onto the small dog paddocks, and the outdoor sensory zone which opens onto the large dog play and
    exercise field. The small and large dog areas share a fence line. Trees run around the outside.</desc>

  <defs>
    <pattern id="grassTex" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M5 22c1-4 2-7 3-11M13 24c1-5 1-8 2-12M21 22c1-4 2-7 3-11"
            stroke="#8FA168" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".38"/>
    </pattern>

    <!-- one tree, reused round the boundary -->
    <g id="tree">
      <rect x="-3" y="5" width="6" height="15" rx="2.5" fill="#5E4630"/>
      <circle cx="-7" cy="1" r="10" fill="#44552C"/>
      <circle cx="7" cy="2" r="9" fill="#5A6D3B"/>
      <circle cx="0" cy="-6" r="12" fill="#4F6034"/>
    </g>

    <!-- a dog — no fills set, so each <use> can colour its own -->
    <g id="dog">
      <path d="M-13 -3C-20 -6 -21 -14 -17 -17L-13 -13C-16 -11 -15 -7 -10 -5Z"/>
      <ellipse cx="0" cy="0" rx="13" ry="6.5"/>
      <rect x="-9" y="4" width="3.4" height="9" rx="1.7"/>
      <rect x="-3.5" y="4" width="3.4" height="9" rx="1.7"/>
      <rect x="4" y="4" width="3.4" height="9" rx="1.7"/>
      <rect x="9" y="4" width="3.4" height="9" rx="1.7"/>
      <circle cx="13" cy="-7" r="6"/>
      <ellipse cx="19.5" cy="-5" rx="4.5" ry="3.2"/>
      <path d="M10 -12C8 -18.5 13.5 -19.5 15.5 -14Z"/>
    </g>

    <!-- round hay bale -->
    <g id="bale">
      <rect x="-15" y="-11" width="30" height="22" rx="10" fill="#C9B071"/>
      <rect x="-15" y="-11" width="30" height="22" rx="10" fill="none" stroke="#9C8437" stroke-width="2"/>
      <path d="M-6 -10C-9.5 -5 -9.5 5 -6 10M2 -10C-1.5 -5 -1.5 5 2 10"
            stroke="#A8913F" stroke-width="2" fill="none"/>
    </g>

    <style>
      .plate  { fill:#FFFDF8; opacity:.95; }
      .ptext  { fill:#3B4A2C; font-size:15px; font-weight:700; }
      .marker { fill:#4A5930; }
      .mnum   { fill:#ffffff; font-size:15px; font-weight:700; }
      .ltext  { fill:#3B4A2C; font-size:14.5px; font-weight:600; }
      .fence  { fill:none; stroke:#55663A; stroke-width:3.5; }
    </style>
  </defs>

  <!-- surrounding farmland -->
  <rect width="900" height="640" fill="#8FA46B"/>
  <rect width="900" height="640" fill="url(#grassTex)"/>

  <!-- ===================== entrance driveway ===================== -->
  <path d="M210 6C208 78 194 168 196 258" stroke="#D8C7A2" stroke-width="20"
        fill="none" stroke-linecap="round"/>
  <text x="240" y="140" font-size="13.5" font-weight="700" fill="#3B4A2C">Entrance</text>

  <!-- ============ small dog paddocks (5) — share their bottom fence with (6) ============ -->
  <path d="M388 302C386 258 384 200 394 184C404 166 432 157 472 154C560 147 660 151 740 148
           C802 146 850 156 860 178C870 202 866 250 862 292C790 302 700 294 620 300
           C540 306 460 296 388 302Z" fill="#CBD9A6"/>

  <!-- ============ large dog field (6) — top edge is that same fence ============ -->
  <path d="M388 302C460 296 540 306 620 300C700 294 790 302 862 292C878 318 876 398 868 436
           C860 466 800 478 730 480C630 483 520 480 456 474C414 470 390 452 388 416
           C386 372 386 330 388 302Z" fill="#B0C486"/>

  <!-- worn tracks -->
  <g stroke="#DBCCA8" stroke-width="9" fill="none" stroke-linecap="round" opacity=".75">
    <path d="M432 246c90-22 150 6 232-12 62-14 112-26 158-22"/>
    <path d="M432 424c96-24 158 4 244-14 60-14 106-26 148-24"/>
    <path d="M440 196c64-14 110 2 172-8"/>
  </g>

  <!-- outer fences + the shared dividing fence between 5 and 6 -->
  <path d="M388 302C386 258 384 200 394 184C404 166 432 157 472 154C560 147 660 151 740 148
           C802 146 850 156 860 178C870 202 866 250 862 292" class="fence"/>
  <path d="M388 302C460 296 540 306 620 300C700 294 790 302 862 292C878 318 876 398 868 436
           C860 466 800 478 730 480C630 483 520 480 456 474C414 470 390 452 388 416
           C386 372 386 330 388 302Z" class="fence"/>
  <!-- the fence they share -->
  <path d="M388 302C460 296 540 306 620 300C700 294 790 302 862 292" class="fence" stroke="#6B7C47"/>
  <!-- fence splitting the two small paddocks -->
  <path d="M618 150C623 190 615 258 620 300" class="fence" stroke="#6B7C47"/>

  <!-- ============ outdoor sensory zone (4) — runs into the large dog field ============ -->
  <path d="M276 402C272 372 288 346 316 340C348 333 380 340 390 364C400 388 398 428 388 448
           C378 468 340 474 310 470C284 466 278 434 276 402Z" fill="#D9C67F"/>
  <path d="M276 402C272 372 288 346 316 340C348 333 380 340 390 364C400 388 398 428 388 448
           C378 468 340 474 310 470C284 466 278 434 276 402Z" class="fence"/>
  <g fill="#A8913F" opacity=".6">
    <circle cx="308" cy="378" r="8"/><circle cx="348" cy="396" r="10"/><circle cx="366" cy="362" r="6"/>
    <circle cx="308" cy="432" r="7"/><circle cx="348" cy="444" r="8"/>
  </g>

  <!-- ============ reception, stables & indoor rest (3) ============ -->
  <g transform="translate(106 69.3) scale(0.7)">
    <path d="M254 204L282 168H378L406 204Z" fill="#5E4630"/>
    <rect x="266" y="200" width="128" height="94" rx="8" fill="#8A6440"/>
    <g stroke="#4A3423" stroke-width="2.5">
      <rect x="278" y="224" width="32" height="70" rx="4" fill="#6E4F33"/>
      <rect x="278" y="224" width="32" height="31" rx="4" fill="#3B2C1D"/>
      <rect x="316" y="224" width="32" height="70" rx="4" fill="#6E4F33"/>
      <rect x="316" y="224" width="32" height="31" rx="4" fill="#3B2C1D"/>
      <rect x="354" y="224" width="32" height="70" rx="4" fill="#6E4F33"/>
      <rect x="354" y="224" width="32" height="31" rx="4" fill="#3B2C1D"/>
    </g>
  </g>

  <!-- ============ car park (1) — reversed L, foot runs in front of the K9-iQ barn ============ -->
  <g>
    <path d="M154 284C150 262 170 252 196 252C224 252 256 258 256 284
             C258 330 258 370 258 414C258 444 250 466 224 468
             C170 474 96 472 48 468C26 466 16 452 18 434
             C20 414 34 404 56 404C92 402 126 406 150 404
             C154 372 152 330 154 284Z" fill="#CFCFC6"/>
    <g stroke="#FFFFFF" stroke-width="2.5" opacity=".85">
      <path d="M180 270v122M206 270v122M232 274v116"/>
      <path d="M62 414v46M102 414v46M142 414v42"/>
    </g>
    <g transform="translate(172 322)">
      <rect x="0" y="0" width="66" height="30" rx="8" fill="#7A8B54"/>
      <rect x="42" y="6" width="18" height="13" rx="3" fill="#EDEFE6" opacity=".92"/>
      <text x="6" y="21" font-size="10.5" font-weight="700" fill="#FFFFFF">WOOF</text>
      <circle cx="15" cy="32" r="6" fill="#3A3A3A"/><circle cx="52" cy="32" r="6" fill="#3A3A3A"/>
    </g>
  </g>

  <!-- ============ picket fence between the car park and reception ============ -->
  <g>
    <path d="M259 198V404M267 198V404" stroke="#4F6034" stroke-width="2.5" fill="none"/>
    <g fill="#7FA050" stroke="#4F6034" stroke-width="1">
      <rect x="253" y="202" width="20" height="5" rx="2.5"/>
      <rect x="253" y="216" width="20" height="5" rx="2.5"/>
      <rect x="253" y="230" width="20" height="5" rx="2.5"/>
      <rect x="253" y="244" width="20" height="5" rx="2.5"/>
      <rect x="253" y="258" width="20" height="5" rx="2.5"/>
      <rect x="253" y="272" width="20" height="5" rx="2.5"/>
      <rect x="253" y="286" width="20" height="5" rx="2.5"/>
      <rect x="253" y="300" width="20" height="5" rx="2.5"/>
      <rect x="253" y="314" width="20" height="5" rx="2.5"/>
      <rect x="253" y="328" width="20" height="5" rx="2.5"/>
      <rect x="253" y="342" width="20" height="5" rx="2.5"/>
      <rect x="253" y="356" width="20" height="5" rx="2.5"/>
      <rect x="253" y="370" width="20" height="5" rx="2.5"/>
      <rect x="253" y="384" width="20" height="5" rx="2.5"/>
      <rect x="253" y="398" width="20" height="5" rx="2.5"/>
    </g>
  </g>


  <!-- ===================== K9-iQ arena (2) ===================== -->
  <g transform="translate(22.5 92.1) scale(0.7)">
    <path d="M16 270L40 236L75 218L110 236L134 270Z" fill="#5E4630"/>
    <rect x="28" y="266" width="94" height="98" rx="6" fill="#8A6440"/>
    <rect x="66" y="242" width="18" height="16" rx="2" fill="#3B2C1D"/>
    <rect x="50" y="298" width="50" height="66" rx="3" fill="#6E4F33"/>
    <path d="M50 298l50 66M100 298l-50 66M75 298v66" stroke="#4A3423" stroke-width="2.5" fill="none"/>
    <rect x="28" y="368" width="94" height="28" rx="12" fill="#6E4F33"/>
    <text x="75" y="387" font-size="12" font-weight="700" fill="#F2EFE6" text-anchor="middle">K9-iQ</text>
  </g>

  <!-- ===================== hay bales ===================== -->
  <use href="#bale" x="704" y="196"/>
  <use href="#bale" x="470" y="256"/>
  <use href="#bale" x="452" y="434"/>
  <use href="#bale" x="700" y="452"/>

  <!-- ===================== dogs ===================== -->
  <use href="#dog" x="512" y="212" fill="#5E4630"/>
  <use href="#dog" x="778" y="238" fill="#F2EFE6"/>
  <use href="#dog" x="546" y="392" fill="#C9A24B"/>
  <use href="#dog" x="796" y="366" fill="#3F3128"/>

  <!-- ===================== trees round the outer perimeter ===================== -->
  <g>
    <use href="#tree" x="404" y="122"/><use href="#tree" x="462" y="114"/><use href="#tree" x="520" y="120"/>
    <use href="#tree" x="578" y="112"/><use href="#tree" x="636" y="120"/><use href="#tree" x="694" y="112"/>
    <use href="#tree" x="752" y="120"/><use href="#tree" x="812" y="116"/><use href="#tree" x="866" y="128"/>
    <use href="#tree" x="884" y="188"/><use href="#tree" x="890" y="248"/><use href="#tree" x="884" y="308"/>
    <use href="#tree" x="890" y="366"/><use href="#tree" x="882" y="426"/>
    <use href="#tree" x="846" y="494"/><use href="#tree" x="788" y="502"/><use href="#tree" x="730" y="494"/>
    <use href="#tree" x="672" y="502"/><use href="#tree" x="614" y="494"/><use href="#tree" x="556" y="502"/>
    <use href="#tree" x="498" y="494"/><use href="#tree" x="440" y="500"/><use href="#tree" x="384" y="492"/>
    <use href="#tree" x="326" y="492"/><use href="#tree" x="268" y="496"/><use href="#tree" x="206" y="498"/>
    <use href="#tree" x="14" y="516"/><use href="#tree" x="12" y="196"/><use href="#tree" x="140" y="150"/>
  </g>

  <!-- ===================== markers ===================== -->
  <g>
    <circle class="marker" cx="202" cy="288" r="17"/><text class="mnum" x="202" y="294" text-anchor="middle">1</text>
    <circle class="marker" cx="75" cy="228" r="17"/><text class="mnum" x="75" y="234" text-anchor="middle">2</text>
    <circle class="marker" cx="416" cy="204" r="17"/><text class="mnum" x="416" y="210" text-anchor="middle">3</text>
    <circle class="marker" cx="333" cy="406" r="17"/><text class="mnum" x="333" y="412" text-anchor="middle">4</text>
    <circle class="marker" cx="506" cy="178" r="17"/><text class="mnum" x="506" y="184" text-anchor="middle">5</text>
    <circle class="marker" cx="762" cy="178" r="17"/><text class="mnum" x="762" y="184" text-anchor="middle">5</text>
    <circle class="marker" cx="466" cy="360" r="17"/><text class="mnum" x="466" y="366" text-anchor="middle">6</text>
  </g>

  <!-- on-map labels -->
  <rect class="plate" x="524" y="244" width="204" height="26" rx="13"/>
  <text class="ptext" x="626" y="262" text-anchor="middle">Small dog paddocks</text>
  <rect class="plate" x="556" y="418" width="208" height="26" rx="13"/>
  <text class="ptext" x="660" y="436" text-anchor="middle">Large dog field</text>

  <!-- ===================== legend ===================== -->
  <g>
    <rect x="18" y="520" width="864" height="106" rx="18" fill="#F1F3E8" opacity=".93"/>
    <g><circle class="marker" cx="48" cy="558" r="13"/><text class="mnum" x="48" y="563" text-anchor="middle">1</text>
       <text class="ltext" x="70" y="563">Entrance &amp; car park</text></g>
    <g><circle class="marker" cx="308" cy="558" r="13"/><text class="mnum" x="308" y="563" text-anchor="middle">2</text>
       <text class="ltext" x="330" y="563">K9-iQ indoor arena &amp; shop</text></g>
    <g><circle class="marker" cx="48" cy="596" r="13"/><text class="mnum" x="48" y="601" text-anchor="middle">3</text>
       <text class="ltext" x="70" y="601">Reception, stables &amp; indoor rest</text></g>
    <g><circle class="marker" cx="308" cy="596" r="13"/><text class="mnum" x="308" y="601" text-anchor="middle">4</text>
       <text class="ltext" x="330" y="601">Outdoor sensory zone</text></g>
    <g><circle class="marker" cx="624" cy="558" r="13"/><text class="mnum" x="624" y="563" text-anchor="middle">5</text>
       <text class="ltext" x="646" y="563">Small dog play &amp; exercise</text></g>
    <g><circle class="marker" cx="624" cy="596" r="13"/><text class="mnum" x="624" y="601" text-anchor="middle">6</text>
       <text class="ltext" x="646" y="601">Large dog play &amp; exercise</text></g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img"
     aria-labelledby="mapTitle mapDesc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif">
  <title id="mapTitle">Map of the Club K9 site</title>
  <desc id="mapDesc">An illustrated plan of Club K9, a working farm near Rusper. From the entrance: the K9-iQ
    indoor play and enrichment barn with the Country Dog Barn shop, then the car park, then the reception and
    stable-block rest area which opens onto the small dog paddocks, and the outdoor sensory zone which opens
    onto the large dog play and exercise field. Trees run around the outside of the grounds.</desc>

  <defs>
    <pattern id="grassTex" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M5 22c1-4 2-7 3-11M13 24c1-5 1-8 2-12M21 22c1-4 2-7 3-11"
            stroke="#8FA168" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".38"/>
    </pattern>

    <!-- one tree, reused all round the boundary -->
    <g id="tree">
      <rect x="-3" y="5" width="6" height="15" rx="2.5" fill="#5E4630"/>
      <circle cx="-7" cy="1" r="10" fill="#44552C"/>
      <circle cx="7" cy="2" r="9" fill="#5A6D3B"/>
      <circle cx="0" cy="-6" r="12" fill="#4F6034"/>
    </g>

    <style>
      .plate  { fill:#FFFDF8; opacity:.95; }
      .ptext  { fill:#3B4A2C; font-size:15px; font-weight:700; }
      .marker { fill:#4A5930; }
      .mnum   { fill:#ffffff; font-size:15px; font-weight:700; }
      .ltext  { fill:#3B4A2C; font-size:14.5px; font-weight:600; }
      .fence  { fill:none; stroke:#55663A; stroke-width:3.5; }
    </style>
  </defs>

  <!-- surrounding farmland -->
  <rect width="900" height="640" fill="#8FA46B"/>
  <rect width="900" height="640" fill="url(#grassTex)"/>

  <!-- ===================== entrance driveway ===================== -->
  <path d="M210 6C208 78 194 168 196 258" stroke="#D8C7A2" stroke-width="20"
        fill="none" stroke-linecap="round"/>
  <text x="240" y="86" font-size="13.5" font-weight="700" fill="#3B4A2C">Entrance</text>

  <!-- ===================== large dog field (6) ===================== -->
  <path id="fieldBig" d="M386 392C382 356 410 336 452 331C540 322 640 328 730 324C800 321 852 330 866 356
           C880 382 872 430 852 452C830 476 760 480 690 481C600 483 500 479 452 474
           C410 470 388 452 386 416Z" fill="#B0C486"/>
  <use href="#fieldBig" fill="url(#grassTex)"/>
  <use href="#fieldBig" class="fence"/>

  <!-- ===================== small dog paddocks (5) ===================== -->
  <path id="fieldSmall" d="M388 216C386 180 414 162 456 157C530 148 612 153 692 149C762 146 826 154 846 176
           C866 198 860 244 842 266C822 290 762 297 692 299C612 302 530 299 458 295
           C414 292 390 276 388 240Z" fill="#CBD9A6"/>
  <use href="#fieldSmall" fill="url(#grassTex)"/>
  <use href="#fieldSmall" class="fence"/>
  <!-- internal fence splitting the two paddocks -->
  <path d="M618 152C623 192 615 260 621 300" class="fence" stroke="#6B7C47"/>

  <!-- worn tracks through the grass -->
  <g stroke="#DBCCA8" stroke-width="9" fill="none" stroke-linecap="round" opacity=".8">
    <path d="M432 250c90-22 150 6 232-12 62-14 112-28 158-24"/>
    <path d="M432 424c96-24 158 4 244-14 60-14 106-26 148-24"/>
    <path d="M440 198c64-14 110 2 172-8"/>
  </g>

  <!-- ============ outdoor sensory zone (4) — runs into the large dog field ============ -->
  <path id="sensory" d="M276 402C272 372 288 346 316 340C348 333 380 340 390 364C400 388 398 428 388 448
           C378 468 340 474 310 470C284 466 278 434 276 402Z" fill="#D9C67F"/>
  <use href="#sensory" class="fence"/>
  <g fill="#A8913F" opacity=".6">
    <circle cx="308" cy="378" r="8"/><circle cx="348" cy="396" r="10"/><circle cx="366" cy="362" r="6"/>
    <circle cx="308" cy="432" r="7"/><circle cx="348" cy="444" r="8"/>
  </g>

  <!-- ============ reception, stables & indoor rest (3) — opens onto the paddocks ============ -->
  <g>
    <path d="M254 204L282 168H378L406 204Z" fill="#5E4630"/>
    <rect x="266" y="200" width="128" height="94" rx="8" fill="#8A6440"/>
    <g stroke="#4A3423" stroke-width="2.5">
      <rect x="278" y="224" width="32" height="70" rx="4" fill="#6E4F33"/>
      <rect x="278" y="224" width="32" height="31" rx="4" fill="#3B2C1D"/>
      <rect x="316" y="224" width="32" height="70" rx="4" fill="#6E4F33"/>
      <rect x="316" y="224" width="32" height="31" rx="4" fill="#3B2C1D"/>
      <rect x="354" y="224" width="32" height="70" rx="4" fill="#6E4F33"/>
      <rect x="354" y="224" width="32" height="31" rx="4" fill="#3B2C1D"/>
    </g>
  </g>

  <!-- ===================== car park (1) ===================== -->
  <g>
    <path d="M154 282C150 262 168 252 194 252C222 252 252 258 254 282C256 312 258 356 254 380
             C250 402 218 406 194 404C166 402 152 392 152 366C152 340 156 306 154 282Z" fill="#CFCFC6"/>
    <g stroke="#FFFFFF" stroke-width="2.5" opacity=".9">
      <path d="M178 270v118M204 270v118M230 272v112"/>
    </g>
    <g transform="translate(160 412)">
      <rect x="0" y="0" width="70" height="32" rx="8" fill="#7A8B54"/>
      <rect x="44" y="6" width="20" height="14" rx="3" fill="#EDEFE6" opacity=".92"/>
      <text x="7" y="22" font-size="11" font-weight="700" fill="#FFFFFF">WOOF</text>
      <circle cx="16" cy="34" r="6.5" fill="#3A3A3A"/><circle cx="55" cy="34" r="6.5" fill="#3A3A3A"/>
    </g>
  </g>

  <!-- ===================== K9-iQ arena & shop (2) ===================== -->
  <g>
    <path d="M16 270L40 236L75 218L110 236L134 270Z" fill="#5E4630"/>
    <rect x="28" y="266" width="94" height="98" rx="6" fill="#8A6440"/>
    <rect x="66" y="242" width="18" height="16" rx="2" fill="#3B2C1D"/>
    <rect x="50" y="298" width="50" height="66" rx="3" fill="#6E4F33"/>
    <path d="M50 298l50 66M100 298l-50 66M75 298v66" stroke="#4A3423" stroke-width="2.5" fill="none"/>
    <rect x="28" y="368" width="94" height="28" rx="12" fill="#6E4F33"/>
    <text x="75" y="387" font-size="11" font-weight="700" fill="#F2EFE6" text-anchor="middle">SHOP</text>
  </g>

  <!-- ===================== dogs ===================== -->
  <g>
    <g transform="translate(700 232)" fill="#5E4630">
      <ellipse rx="14" ry="8"/><circle cx="12" cy="-7" r="6.5"/>
      <path d="M-13 1l-7 7" stroke="#5E4630" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>
    <g transform="translate(570 404)" fill="#C9A24B">
      <ellipse rx="13" ry="7.5"/><circle cx="11" cy="-6" r="6"/>
      <path d="M-12 1l-6 6" stroke="#C9A24B" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>
    <g transform="translate(486 214)" fill="#F2EFE6">
      <ellipse rx="10" ry="6"/><circle cx="9" cy="-5" r="5"/>
      <path d="M-9 1l-5 5" stroke="#F2EFE6" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- ===================== trees round the outer perimeter ===================== -->
  <g>
    <use href="#tree" x="404" y="122"/><use href="#tree" x="462" y="114"/><use href="#tree" x="520" y="120"/>
    <use href="#tree" x="578" y="112"/><use href="#tree" x="636" y="120"/><use href="#tree" x="694" y="112"/>
    <use href="#tree" x="752" y="120"/><use href="#tree" x="812" y="116"/><use href="#tree" x="866" y="128"/>
    <use href="#tree" x="884" y="188"/><use href="#tree" x="890" y="248"/><use href="#tree" x="884" y="308"/>
    <use href="#tree" x="890" y="366"/><use href="#tree" x="882" y="426"/>
    <use href="#tree" x="846" y="494"/><use href="#tree" x="788" y="502"/><use href="#tree" x="730" y="494"/>
    <use href="#tree" x="672" y="502"/><use href="#tree" x="614" y="494"/><use href="#tree" x="556" y="502"/>
    <use href="#tree" x="498" y="494"/><use href="#tree" x="440" y="500"/><use href="#tree" x="384" y="492"/>
    <use href="#tree" x="326" y="492"/><use href="#tree" x="268" y="496"/><use href="#tree" x="262" y="452"/>
    <use href="#tree" x="14" y="430"/><use href="#tree" x="12" y="196"/><use href="#tree" x="140" y="150"/>
  </g>

  <!-- ===================== markers ===================== -->
  <g>
    <circle class="marker" cx="202" cy="316" r="17"/><text class="mnum" x="202" y="322" text-anchor="middle">1</text>
    <circle class="marker" cx="75" cy="190" r="17"/><text class="mnum" x="75" y="196" text-anchor="middle">2</text>
    <circle class="marker" cx="418" cy="212" r="17"/><text class="mnum" x="418" y="218" text-anchor="middle">3</text>
    <circle class="marker" cx="333" cy="406" r="17"/><text class="mnum" x="333" y="412" text-anchor="middle">4</text>
    <circle class="marker" cx="506" cy="182" r="17"/><text class="mnum" x="506" y="188" text-anchor="middle">5</text>
    <circle class="marker" cx="746" cy="180" r="17"/><text class="mnum" x="746" y="186" text-anchor="middle">5</text>
    <circle class="marker" cx="470" cy="360" r="17"/><text class="mnum" x="470" y="366" text-anchor="middle">6</text>
  </g>

  <!-- on-map labels -->
  <rect class="plate" x="522" y="240" width="204" height="26" rx="13"/>
  <text class="ptext" x="624" y="258" text-anchor="middle">Small dog paddocks</text>
  <rect class="plate" x="552" y="428" width="208" height="26" rx="13"/>
  <text class="ptext" x="656" y="446" text-anchor="middle">Large dog field</text>

  <!-- ===================== legend ===================== -->
  <g>
    <rect x="18" y="520" width="864" height="106" rx="18" fill="#F1F3E8" opacity=".93"/>
    <g><circle class="marker" cx="48" cy="558" r="13"/><text class="mnum" x="48" y="563" text-anchor="middle">1</text>
       <text class="ltext" x="70" y="563">Entrance &amp; car park</text></g>
    <g><circle class="marker" cx="308" cy="558" r="13"/><text class="mnum" x="308" y="563" text-anchor="middle">2</text>
       <text class="ltext" x="330" y="563">K9-iQ arena &amp; Country Dog Barn shop</text></g>
    <g><circle class="marker" cx="48" cy="596" r="13"/><text class="mnum" x="48" y="601" text-anchor="middle">3</text>
       <text class="ltext" x="70" y="601">Reception, stables &amp; indoor rest</text></g>
    <g><circle class="marker" cx="308" cy="596" r="13"/><text class="mnum" x="308" y="601" text-anchor="middle">4</text>
       <text class="ltext" x="330" y="601">Outdoor sensory zone</text></g>
    <g><circle class="marker" cx="624" cy="558" r="13"/><text class="mnum" x="624" y="563" text-anchor="middle">5</text>
       <text class="ltext" x="646" y="563">Small dog play &amp; exercise</text></g>
    <g><circle class="marker" cx="624" cy="596" r="13"/><text class="mnum" x="624" y="601" text-anchor="middle">6</text>
       <text class="ltext" x="646" y="601">Large dog play &amp; exercise</text></g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img"
     aria-labelledby="mapTitle mapDesc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif">
  <title id="mapTitle">Map of the Club K9 site</title>
  <desc id="mapDesc">An illustrated aerial map of Club K9 at Horse Ghylls Wood Farm, showing the arrival area,
    the barn, the free-running field, the agility zone, the long-grass sniffari, the shaded oak rest area,
    the puppy paddock and the quiet zone.</desc>

  <defs>
    <pattern id="grassTex" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M5 24c1-5 2-8 3-12M14 26c1-6 1-9 2-13M23 24c1-5 2-8 3-12"
            stroke="#8FA168" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".5"/>
    </pattern>
    <pattern id="longGrass" width="17" height="17" patternUnits="userSpaceOnUse">
      <path d="M3 16C3 9 4 6 5 2M9 17C9 8 10 5 11 1M15 16c0-7 1-10 2-14"
            stroke="#6F8348" stroke-width="2" fill="none" stroke-linecap="round" opacity=".65"/>
    </pattern>
    <!-- reusable label plate: keeps text readable over any fill -->
    <style>
      .plate  { fill:#FFFDF8; opacity:.92; }
      .ptext  { fill:#3B4A2C; font-size:15px; font-weight:700; }
      .marker { fill:#5C6B3D; }
      .mnum   { fill:#ffffff; font-size:16px; font-weight:700; }
    </style>
  </defs>

  <rect width="1000" height="660" fill="#E8EBE0"/>

  <!-- ================= pasture ================= -->
  <path d="M112 128C300 84 640 74 890 122c62 12 74 84 58 176-18 104 10 196-84 250-140 80-528 70-660 6
           C88 520 62 436 76 342 88 254 70 142 112 128Z" fill="#9FB177"/>
  <path d="M112 128C300 84 640 74 890 122c62 12 74 84 58 176-18 104 10 196-84 250-140 80-528 70-660 6
           C88 520 62 436 76 342 88 254 70 142 112 128Z" fill="url(#grassTex)"/>

  <!-- ================= woodland ================= -->
  <path d="M40 26h920c14 48-34 62-108 52-116-16-198 14-296 4-136-14-224 20-330 6-86-12-200-14-186-62Z" fill="#4F6034"/>
  <g fill="#3E4E28">
    <circle cx="132" cy="44" r="20"/><circle cx="196" cy="32" r="16"/><circle cx="258" cy="48" r="21"/>
    <circle cx="330" cy="34" r="17"/><circle cx="406" cy="46" r="19"/><circle cx="486" cy="32" r="16"/>
    <circle cx="560" cy="46" r="20"/><circle cx="638" cy="34" r="17"/><circle cx="714" cy="46" r="19"/>
    <circle cx="792" cy="34" r="16"/><circle cx="864" cy="46" r="18"/><circle cx="926" cy="34" r="15"/>
  </g>
  <path d="M36 62c28-6 44 40 38 116-6 78 12 132-6 192-12 42-46 22-52-28-8-86-16-274 20-280Z" fill="#4F6034"/>
  <g fill="#3E4E28">
    <circle cx="48" cy="150" r="16"/><circle cx="48" cy="214" r="17"/><circle cx="42" cy="278" r="15"/>
    <circle cx="52" cy="340" r="18"/><circle cx="44" cy="404" r="15"/><circle cx="50" cy="456" r="16"/>
  </g>

  <!-- ================= zone fills ================= -->
  <!-- 5 sniffari -->
  <path d="M646 138c88-12 178-6 220 20 32 20 24 68-10 84-60 30-176 28-224 2-38-20-28-96 14-106Z" fill="#8CA05F"/>
  <path d="M646 138c88-12 178-6 220 20 32 20 24 68-10 84-60 30-176 28-224 2-38-20-28-96 14-106Z" fill="url(#longGrass)"/>
  <!-- 6 oak shade -->
  <path d="M792 306c56-6 98 24 102 68 4 46-40 76-96 72-54-4-86-38-82-78 4-38 28-58 76-62Z" fill="#7E9257"/>
  <!-- 4 agility -->
  <path d="M312 442c104-14 194-8 228 20 28 24 16 72-22 86-68 22-178 18-222-8-36-20-24-90 16-98Z" fill="#8CA05F"/>
  <!-- 7 puppy paddock -->
  <rect x="628" y="450" width="180" height="104" rx="20" fill="#B3C48C"/>
  <rect x="628" y="450" width="180" height="104" rx="20" fill="none"
        stroke="#5C6B3D" stroke-width="3" stroke-dasharray="8 7"/>
  <!-- 8 quiet zone -->
  <path d="M132 372c54-8 94 12 98 46 4 36-36 58-88 54-46-4-72-26-68-56 4-28 22-38 58-44Z" fill="#B3C48C"/>

  <!-- ================= paths ================= -->
  <g stroke="#DCCCA8" stroke-width="16" fill="none" stroke-linecap="round">
    <path d="M206 556c44-58 92-80 168-88 92-10 148 12 232 2 88-10 128-46 162-96"/>
    <path d="M292 268c66 22 142 20 214-6"/>
  </g>

  <!-- ================= oak trees ================= -->
  <g>
    <rect x="826" y="356" width="8" height="22" rx="3" fill="#5E4630"/>
    <circle cx="830" cy="340" r="26" fill="#41522B"/>
    <rect x="878" y="392" width="7" height="18" rx="3" fill="#5E4630"/>
    <circle cx="881" cy="378" r="21" fill="#41522B"/>
  </g>

  <!-- ================= agility props ================= -->
  <g stroke="#C9A24B" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- A-frame, with a crossbar so it reads as equipment -->
    <path d="M344 506l16-26 16 26M350 496h20"/>
    <!-- weave poles -->
    <path d="M400 506v-22M412 506v-22M424 506v-22M436 506v-22"/>
    <!-- jump -->
    <path d="M462 506v-24M492 506v-24M462 488h30"/>
  </g>
  <!-- tunnel -->
  <path d="M516 506a18 15 0 0 1 36 0" fill="none" stroke="#C9A24B" stroke-width="4"/>
  <path d="M524 506a10 9 0 0 1 20 0" fill="none" stroke="#C9A24B" stroke-width="2.5" opacity=".7"/>

  <!-- ================= the barn ================= -->
  <g>
    <path d="M150 214l68-38 68 38Z" fill="#5E4630"/>
    <rect x="158" y="212" width="120" height="72" rx="5" fill="#8A6440"/>
    <rect x="200" y="242" width="36" height="42" rx="4" fill="#F2EFE6"/>
    <rect x="170" y="228" width="22" height="20" rx="3" fill="#F2EFE6" opacity=".85"/>
    <rect x="246" y="228" width="22" height="20" rx="3" fill="#F2EFE6" opacity=".85"/>
  </g>

  <!-- ================= arrival & parking ================= -->
  <g>
    <rect x="118" y="516" width="150" height="74" rx="12" fill="#CFCFC6"/>
    <g stroke="#FFFFFF" stroke-width="3" opacity=".9">
      <path d="M156 524v58M194 524v58M232 524v58"/>
    </g>
    <!-- woof bus, on the drive above the parking bays -->
    <g transform="translate(150 478)">
      <rect x="0" y="0" width="78" height="36" rx="8" fill="#7A8B54"/>
      <rect x="48" y="6" width="23" height="16" rx="4" fill="#EDEFE6" opacity=".92"/>
      <text x="7" y="24" font-size="12" font-weight="700" fill="#FFFFFF">WOOF</text>
      <circle cx="18" cy="38" r="7" fill="#3A3A3A"/><circle cx="62" cy="38" r="7" fill="#3A3A3A"/>
    </g>
  </g>

  <!-- ================= perimeter fence ================= -->
  <path d="M112 128C300 84 640 74 890 122c62 12 74 84 58 176-18 104 10 196-84 250-140 80-528 70-660 6
           C88 520 62 436 76 342 88 254 70 142 112 128Z"
        fill="none" stroke="#5C6B3D" stroke-width="5" stroke-dasharray="3 12" stroke-linecap="round"/>

  <!-- ================= dogs ================= -->
  <g>
    <g transform="translate(556 316)" fill="#5E4630">
      <ellipse cx="0" cy="0" rx="16" ry="9"/><circle cx="14" cy="-8" r="7.5"/>
      <path d="M-15 2l-8 8" stroke="#5E4630" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>
    <g transform="translate(392 336)" fill="#C9A24B">
      <ellipse cx="0" cy="0" rx="14" ry="8"/><circle cx="12" cy="-7" r="6.5"/>
      <path d="M-13 1l-7 7" stroke="#C9A24B" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>
    <g transform="translate(690 500)" fill="#F2EFE6">
      <ellipse cx="0" cy="0" rx="12" ry="7"/><circle cx="10" cy="-6" r="6"/>
      <path d="M-11 1l-6 6" stroke="#F2EFE6" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- ================= markers + labels ================= -->
  <!-- 1 arrival -->
  <g><circle class="marker" cx="297" cy="552" r="19"/><text class="mnum" x="297" y="558" text-anchor="middle">1</text>
     <rect class="plate" x="114" y="604" width="158" height="28" rx="14"/>
     <text class="ptext" x="193" y="623" text-anchor="middle">Arrival &amp; drop-off</text></g>
  <!-- 2 barn -->
  <g><circle class="marker" cx="218" cy="176" r="19"/><text class="mnum" x="218" y="182" text-anchor="middle">2</text>
     <rect class="plate" x="122" y="296" width="194" height="28" rx="14"/>
     <text class="ptext" x="219" y="315" text-anchor="middle">The Barn — indoor arena</text></g>
  <!-- 3 free-running field -->
  <g><circle class="marker" cx="470" cy="196" r="19"/><text class="mnum" x="470" y="202" text-anchor="middle">3</text>
     <rect class="plate" x="386" y="222" width="168" height="28" rx="14"/>
     <text class="ptext" x="470" y="241" text-anchor="middle">Free-running field</text></g>
  <!-- 4 agility -->
  <g><circle class="marker" cx="432" cy="436" r="19"/><text class="mnum" x="432" y="442" text-anchor="middle">4</text>
     <rect class="plate" x="370" y="526" width="128" height="28" rx="14"/>
     <text class="ptext" x="434" y="545" text-anchor="middle">Agility &amp; play</text></g>
  <!-- 5 sniffari -->
  <g><circle class="marker" cx="756" cy="152" r="19"/><text class="mnum" x="756" y="158" text-anchor="middle">5</text>
     <rect class="plate" x="662" y="232" width="190" height="28" rx="14"/>
     <text class="ptext" x="757" y="251" text-anchor="middle">Sniffari — long grass</text></g>
  <!-- 6 oak shade -->
  <g><circle class="marker" cx="806" cy="316" r="19"/><text class="mnum" x="806" y="322" text-anchor="middle">6</text>
     <rect class="plate" x="784" y="424" width="132" height="28" rx="14"/>
     <text class="ptext" x="850" y="443" text-anchor="middle">Old oak shade</text></g>
  <!-- 7 puppy paddock -->
  <g><circle class="marker" cx="652" cy="474" r="19"/><text class="mnum" x="652" y="480" text-anchor="middle">7</text>
     <rect class="plate" x="652" y="566" width="132" height="28" rx="14"/>
     <text class="ptext" x="718" y="585" text-anchor="middle">Puppy paddock</text></g>
  <!-- 8 quiet zone -->
  <g><circle class="marker" cx="180" cy="400" r="19"/><text class="mnum" x="180" y="406" text-anchor="middle">8</text>
     <rect class="plate" x="118" y="336" width="106" height="28" rx="14"/>
     <text class="ptext" x="171" y="355" text-anchor="middle">Quiet zone</text></g>

  <!-- compass -->
  <g transform="translate(936 606)">
    <circle r="24" fill="#FFFDF8" opacity=".92"/>
    <path d="M0-14l6 15-6-4-6 4Z" fill="#5C6B3D"/>
    <text y="-16" text-anchor="middle" font-size="11" font-weight="700" fill="#5C6B3D">N</text>
  </g>
</svg>

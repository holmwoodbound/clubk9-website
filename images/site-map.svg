<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img"
     aria-labelledby="mapTitle mapDesc" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, sans-serif">
  <title id="mapTitle">Map of the Club K9 site</title>
  <desc id="mapDesc">An illustrated plan of Club K9 off Capel Road, Rusper. From the entrance: the K9-iQ indoor
    play and enrichment barn with the Country Dog Barn shop, then the car park, then the daycare reception and
    indoor rest area which opens onto the small dog paddocks, and the outdoor sensory zone which opens onto the
    large dog play and exercise field. Trees run around the outside of the grounds.</desc>

  <defs>
    <pattern id="grassTex" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M5 22c1-4 2-7 3-11M13 24c1-5 1-8 2-12M21 22c1-4 2-7 3-11"
            stroke="#8FA168" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".4"/>
    </pattern>

    <!-- one tree, reused all round the boundary -->
    <g id="tree">
      <rect x="-3" y="5" width="6" height="15" rx="2.5" fill="#5E4630"/>
      <circle cx="-7" cy="1" r="10" fill="#44552C"/>
      <circle cx="7" cy="2" r="9" fill="#5A6D3B"/>
      <circle cx="0" cy="-6" r="12" fill="#4F6034"/>
    </g>

    <style>
      .plate  { fill:#FFFDF8; opacity:.94; }
      .ptext  { fill:#3B4A2C; font-size:15px; font-weight:700; }
      .marker { fill:#5C6B3D; }
      .mnum   { fill:#ffffff; font-size:15px; font-weight:700; }
      .ltext  { fill:#3B4A2C; font-size:14.5px; font-weight:600; }
      .fence  { fill:none; stroke:#5C6B3D; stroke-width:3.5; }
    </style>
  </defs>

  <rect width="900" height="640" fill="#E8EBE0"/>

  <!-- ===================== entrance driveway ===================== -->
  <path d="M208 8C208 80 196 170 196 258" stroke="#DCCCA8" stroke-width="20"
        fill="none" stroke-linecap="round"/>
  <text x="238" y="86" font-size="13.5" font-weight="700" fill="#8A7A55">Entrance</text>

  <!-- ===================== large dog field (6) ===================== -->
  <rect x="382" y="330" width="486" height="142" rx="48" fill="#8CA05F"/>
  <rect x="382" y="330" width="486" height="142" rx="48" fill="url(#grassTex)"/>
  <rect x="382" y="330" width="486" height="142" rx="48" class="fence"/>

  <!-- ===================== small dog paddocks (5) ===================== -->
  <rect x="382" y="158" width="478" height="136" rx="46" fill="#B3C48C"/>
  <rect x="382" y="158" width="478" height="136" rx="46" fill="url(#grassTex)"/>
  <rect x="382" y="158" width="478" height="136" rx="46" class="fence"/>
  <!-- internal fence splitting the two paddocks -->
  <path d="M616 158v136" class="fence" stroke="#6E7F4A"/>

  <!-- worn tracks through the grass -->
  <g stroke="#D9C9A6" stroke-width="9" fill="none" stroke-linecap="round" opacity=".8">
    <path d="M430 250c90-22 150 6 232-12 66-14 118-30 166-26"/>
    <path d="M430 420c96-24 158 4 244-14 62-14 108-28 152-26"/>
    <path d="M436 200c66-14 112 2 176-8"/>
  </g>

  <!-- ===================== outdoor sensory zone (4) — attached to the large dog field -->
  <rect x="268" y="336" width="126" height="130" rx="30" fill="#CDBA76"/>
  <rect x="268" y="336" width="126" height="130" rx="30" class="fence"/>
  <g fill="#A8913F" opacity=".65">
    <circle cx="300" cy="372" r="8"/><circle cx="342" cy="392" r="10"/><circle cx="368" cy="358" r="6"/>
    <circle cx="304" cy="428" r="7"/><circle cx="348" cy="440" r="8"/>
  </g>

  <!-- ============ reception, stables & indoor rest (3) — attached to the paddocks ============ -->
  <g>
    <path d="M254 204L282 168H378L406 204Z" fill="#5E4630"/>
    <rect x="266" y="200" width="128" height="94" rx="8" fill="#8A6440"/>
    <!-- three stable doors, top halves open -->
    <g stroke="#4A3423" stroke-width="2.5">
      <rect x="278" y="224" width="32" height="70" rx="4" fill="#6E4F33"/>
      <rect x="278" y="224" width="32" height="31" rx="4" fill="#3B2C1D"/>
      <rect x="316" y="224" width="32" height="70" rx="4" fill="#6E4F33"/>
      <rect x="316" y="224" width="32" height="31" rx="4" fill="#3B2C1D"/>
      <rect x="354" y="224" width="32" height="70" rx="4" fill="#6E4F33"/>
      <rect x="354" y="224" width="32" height="31" rx="4" fill="#3B2C1D"/>
    </g>
  </g>

  <!-- ===================== car park (1) ===================== -->
  <g>
    <rect x="150" y="252" width="104" height="150" rx="26" fill="#CFCFC6"/>
    <g stroke="#FFFFFF" stroke-width="2.5" opacity=".9">
      <path d="M176 268v118M202 268v118M228 268v118"/>
    </g>
    <!-- the woof bus, pulling in -->
    <g transform="translate(160 412)">
      <rect x="0" y="0" width="70" height="32" rx="8" fill="#7A8B54"/>
      <rect x="44" y="6" width="20" height="14" rx="3" fill="#EDEFE6" opacity=".92"/>
      <text x="7" y="22" font-size="11" font-weight="700" fill="#FFFFFF">WOOF</text>
      <circle cx="16" cy="34" r="6.5" fill="#3A3A3A"/><circle cx="55" cy="34" r="6.5" fill="#3A3A3A"/>
    </g>
  </g>

  <!-- ===================== K9-iQ arena & shop (2) ===================== -->
  <g>
    <!-- gambrel (barn) roof -->
    <path d="M16 270L40 236L75 218L110 236L134 270Z" fill="#5E4630"/>
    <rect x="28" y="266" width="94" height="98" rx="6" fill="#8A6440"/>
    <!-- hayloft opening -->
    <rect x="66" y="242" width="18" height="16" rx="2" fill="#3B2C1D"/>
    <!-- big sliding barn doors with cross-bracing -->
    <rect x="50" y="298" width="50" height="66" rx="3" fill="#6E4F33"/>
    <path d="M50 298l50 66M100 298l-50 66M75 298v66" stroke="#4A3423" stroke-width="2.5" fill="none"/>
    <!-- Country Dog Barn shop, lean-to -->
    <rect x="28" y="368" width="94" height="28" rx="12" fill="#6E4F33"/>
    <text x="75" y="387" font-size="11" font-weight="700" fill="#F2EFE6" text-anchor="middle">SHOP</text>
  </g>

  <!-- ===================== dogs ===================== -->
  <g>
    <g transform="translate(690 230)" fill="#5E4630">
      <ellipse rx="14" ry="8"/><circle cx="12" cy="-7" r="6.5"/>
      <path d="M-13 1l-7 7" stroke="#5E4630" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>
    <g transform="translate(560 402)" fill="#C9A24B">
      <ellipse rx="13" ry="7.5"/><circle cx="11" cy="-6" r="6"/>
      <path d="M-12 1l-6 6" stroke="#C9A24B" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>
    <g transform="translate(478 214)" fill="#F2EFE6">
      <ellipse rx="10" ry="6"/><circle cx="9" cy="-5" r="5"/>
      <path d="M-9 1l-5 5" stroke="#F2EFE6" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- ===================== trees round the outer perimeter ===================== -->
  <g>
    <!-- along the top, between road and paddocks -->
    <use href="#tree" x="404" y="126"/><use href="#tree" x="462" y="118"/><use href="#tree" x="520" y="126"/>
    <use href="#tree" x="578" y="116"/><use href="#tree" x="636" y="126"/><use href="#tree" x="694" y="118"/>
    <use href="#tree" x="752" y="126"/><use href="#tree" x="810" y="118"/><use href="#tree" x="862" y="130"/>
    <!-- right-hand edge -->
    <use href="#tree" x="884" y="186"/><use href="#tree" x="890" y="246"/><use href="#tree" x="884" y="306"/>
    <use href="#tree" x="890" y="366"/><use href="#tree" x="884" y="426"/>
    <!-- along the bottom -->
    <use href="#tree" x="844" y="492"/><use href="#tree" x="786" y="500"/><use href="#tree" x="728" y="492"/>
    <use href="#tree" x="670" y="500"/><use href="#tree" x="612" y="492"/><use href="#tree" x="554" y="500"/>
    <use href="#tree" x="496" y="492"/><use href="#tree" x="438" y="500"/><use href="#tree" x="382" y="492"/>
    <use href="#tree" x="324" y="490"/><use href="#tree" x="266" y="494"/><use href="#tree" x="262" y="452"/>
    <!-- left-hand edge -->
    <use href="#tree" x="14" y="430"/><use href="#tree" x="12" y="196"/><use href="#tree" x="140" y="150"/>
  </g>

  <!-- ===================== markers ===================== -->
  <g>
    <circle class="marker" cx="202" cy="300" r="17"/><text class="mnum" x="202" y="306" text-anchor="middle">1</text>
    <circle class="marker" cx="75" cy="190" r="17"/><text class="mnum" x="75" y="196" text-anchor="middle">2</text>
    <circle class="marker" cx="416" cy="212" r="17"/><text class="mnum" x="416" y="218" text-anchor="middle">3</text>
    <circle class="marker" cx="331" cy="400" r="17"/><text class="mnum" x="331" y="406" text-anchor="middle">4</text>
    <circle class="marker" cx="500" cy="180" r="17"/><text class="mnum" x="500" y="186" text-anchor="middle">5</text>
    <circle class="marker" cx="742" cy="180" r="17"/><text class="mnum" x="742" y="186" text-anchor="middle">5</text>
    <circle class="marker" cx="470" cy="356" r="17"/><text class="mnum" x="470" y="362" text-anchor="middle">6</text>
  </g>

  <!-- on-map labels -->
  <rect class="plate" x="518" y="238" width="204" height="26" rx="13"/>
  <text class="ptext" x="620" y="256" text-anchor="middle">Small dog paddocks</text>
  <rect class="plate" x="546" y="428" width="208" height="26" rx="13"/>
  <text class="ptext" x="650" y="446" text-anchor="middle">Large dog field</text>

  <!-- ===================== legend ===================== -->
  <g>
    <line x1="30" y1="536" x2="870" y2="536" stroke="#CBD2BC" stroke-width="2"/>
    <g><circle class="marker" cx="44" cy="570" r="13"/><text class="mnum" x="44" y="575" text-anchor="middle">1</text>
       <text class="ltext" x="66" y="575">Entrance &amp; car park</text></g>
    <g><circle class="marker" cx="304" cy="570" r="13"/><text class="mnum" x="304" y="575" text-anchor="middle">2</text>
       <text class="ltext" x="326" y="575">K9-iQ arena &amp; Country Dog Barn shop</text></g>
    <g><circle class="marker" cx="44" cy="606" r="13"/><text class="mnum" x="44" y="611" text-anchor="middle">3</text>
       <text class="ltext" x="66" y="611">Reception &amp; indoor rest area</text></g>
    <g><circle class="marker" cx="304" cy="606" r="13"/><text class="mnum" x="304" y="611" text-anchor="middle">4</text>
       <text class="ltext" x="326" y="611">Outdoor sensory zone</text></g>
    <g><circle class="marker" cx="620" cy="570" r="13"/><text class="mnum" x="620" y="575" text-anchor="middle">5</text>
       <text class="ltext" x="642" y="575">Small dog play &amp; exercise</text></g>
    <g><circle class="marker" cx="620" cy="606" r="13"/><text class="mnum" x="620" y="611" text-anchor="middle">6</text>
       <text class="ltext" x="642" y="611">Large dog play &amp; exercise</text></g>
  </g>
</svg>
